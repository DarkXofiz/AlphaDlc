name: Decompile Jar

on:
  workflow_dispatch:
  push:
    paths:
      - "input/*.jar"
      - ".github/workflows/decompile.yml"
      - "scripts/**"
      - "overrides/**"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download tools
        run: |
          curl -fL -o vineflower.jar https://github.com/Vineflower/vineflower/releases/download/1.10.1/vineflower-1.10.1.jar
          curl -fL -o tiny-remapper.jar https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.10.4/tiny-remapper-0.10.4-fat.jar
          curl -fL -o yarn.jar "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.4%2Bbuild.8/yarn-1.21.4%2Bbuild.8-v2.jar"
          mkdir -p work
          unzip -p yarn.jar mappings/mappings.tiny > work/yarn.tiny

      - name: Remap intermediary to yarn
        run: |
          mkdir -p work/remapped
          JAR=$(ls input/*.jar | head -n 1)
          java -jar tiny-remapper.jar "$JAR" work/remapped/mod.jar work/yarn.tiny intermediary named
          ls -l work/remapped

      - name: Decompile
        run: |
          rm -rf src libs TRANSLATION_NOTES.md
          mkdir -p work/classes src/main/java src/main/resources libs
          unzip -q -o work/remapped/mod.jar "*.class" -d work/classes
          find work/classes -name "*.class" | wc -l
          java -Xmx4g -jar vineflower.jar -dgs=1 -asc=1 -rsy=1 work/classes src/main/java/
          COUNT=$(find src/main/java -name "*.java" | wc -l)
          echo "Java dosya sayisi: $COUNT"
          if [ "$COUNT" -lt 100 ]; then echo "Decompile basarisiz"; exit 1; fi

      - name: Fix leftover intermediary names
        run: python3 scripts/fix_names.py work/yarn.tiny src/main/java

      - name: Apply known source fixes
        run: python3 scripts/fix_sources.py src/main/java

      - name: Translate Russian strings to English
        run: python3 scripts/translate_ru.py src/main/java TRANSLATION_NOTES.md

      - name: Extract resources and libs
        run: |
          JAR=$(ls input/*.jar | head -n 1)
          unzip -q -o "$JAR" -x "*.class" "META-INF/jars/*" "META-INF/MANIFEST.MF" "alphadlc-refmap.json" -d src/main/resources
          unzip -q -o "$JAR" "META-INF/jars/*" -d work/nested
          cp work/nested/META-INF/jars/*.jar libs/

      - name: Convert access widener to named
        run: python3 scripts/convert_aw.py work/yarn.tiny src/main/resources/alphadlc.accesswidener

      - name: Apply resource overrides (menu images, icon)
        run: cp -r overrides/resources/. src/main/resources/

      - name: Rebrand to MiranWare
        run: python3 scripts/rebrand.py . --add-mixin MiranTitleMixin

      - name: Add MiranWare menu sources
        run: cp -r overrides/java/. src/main/java/

      - name: Commit sources
        run: |
          rm -rf work
          git config user.name "decompile-bot"
          git config user.email "decompile-bot@users.noreply.github.com"
          git add -A src libs TRANSLATION_NOTES.md
          git diff --cached --quiet || git commit -m "Decompiled sources from jar"
          git push
