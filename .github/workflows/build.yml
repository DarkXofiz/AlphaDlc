name: Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Decompile Jar"]
    types: [completed]
  push:
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build
        continue-on-error: true
        run: gradle build --continue --console=plain 2>&1 | tee build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: alphadlc-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
