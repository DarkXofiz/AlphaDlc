plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

loom {
    accessWidenerPath = file("src/main/resources/alphadlc.accesswidener")
    mixin {
        defaultRefmapName = "alphadlc-refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Orijinal jar icinde gomulu gelen bagimliliklar
    implementation fileTree(dir: "libs", include: ["*.jar"])
}

processResources {
    exclude "alphadlc-refmap.json"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xmaxerrs" << "5000"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE")
    // fabric.mod.json "jars" girdileri icin gomulu bagimliliklar
    from("libs") {
        into "META-INF/jars"
    }
}

// Cikti adi orijinal jar ile ayni: alphadlc-0_0_9.jar
remapJar {
    archiveFileName = "alphadlc-0_0_9.jar"
}
